<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="AI Docent evidence readout">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#181c15" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#3d4738"/>
    </marker>
    <style> text { font-family: "JetBrains Mono","SF Mono",ui-monospace,monospace; } </style>
  </defs>

  <rect width="1200" height="260" fill="#0e120c"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" fill="none" stroke="#1c2118" stroke-width="1"/>
  <line x1="430" y1="0" x2="430" y2="260" stroke="#1c2118" stroke-width="1"/>

  <g transform="translate(36,44)">
    <text fill="#e0a83a" font-size="11" letter-spacing="1.5">TTS / docent-ai (prototype)</text>
    <text y="34" fill="#f2efe4" font-size="21" font-weight="700">RAG + LLM + TTS Docent</text>
    <text y="62" fill="#8a9682" font-size="12">관람객 수준별 설명 생성 → 음성 클로닝 출력</text>
  </g>

  <g font-size="11" transform="translate(36,120)">
    <g>
      <rect x="0" y="0" width="90" height="42" rx="4" fill="#0e120c" stroke="#7d8a9a" stroke-width="1.3"/>
      <text x="45" y="26" text-anchor="middle" fill="#d3d8e0">RAG</text>
    </g>
    <path d="M 90 21 L 130 21" stroke="#2e3729" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g transform="translate(130,0)">
      <rect x="0" y="0" width="90" height="42" rx="4" fill="#0e120c" stroke="#4f8f7c" stroke-width="1.3"/>
      <text x="45" y="26" text-anchor="middle" fill="#c9dcd3">LLM</text>
    </g>
    <path d="M 220 21 L 260 21" stroke="#2e3729" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g transform="translate(260,0)">
      <rect x="0" y="0" width="90" height="42" rx="4" fill="#0e120c" stroke="#e0a83a" stroke-width="1.3"/>
      <text x="45" y="26" text-anchor="middle" fill="#f0dcac">TTS</text>
    </g>
  </g>

  <g transform="translate(470,40)" font-size="12" fill="#8a9682">
    <text fill="#5c7452" font-size="11" letter-spacing="1.5">IMPLEMENTED (this repo)</text>

    <g transform="translate(0,32)">
      <text fill="#e0a83a" font-size="18" font-weight="700">3 personas</text>
      <text y="20" fill="#6b7a63" font-size="11">child / general / expert prompt sets</text>
    </g>
    <g transform="translate(0,80)">
      <text fill="#e0a83a" font-size="18" font-weight="700">FastAPI + SSE</text>
      <text y="20" fill="#6b7a63" font-size="11">text / voice / streaming endpoints</text>
    </g>
    <g transform="translate(0,128)">
      <text fill="#e0a83a" font-size="18" font-weight="700">XTTS-v2</text>
      <text y="20" fill="#6b7a63" font-size="11">voice-cloning synthesis, local embeddings</text>
    </g>
    <g transform="translate(360,32)">
      <text fill="#7d8a9a" font-size="13" font-weight="700">not yet measured</text>
      <text y="20" fill="#5f6a58" font-size="11">retrieval quality / groundedness eval</text>
    </g>
  </g>
</svg>
